services:
  # 1. Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=http://localhost:6702  
    container_name: summary-frontend
    restart: always
    ports:
      - "6701:80"  # Maps server port 6701 (HTTP) to container port 80
    networks:
      - summary-network

  # 2. Backend Service (Python)
  backend:
    build:
      context: ./backend
    container_name: summary-backend
    restart: always
    environment:
      - ENV=TEST
      - DATABASE_URL=postgresql://postgres:sql@postgres:5432/summarizer
      - OPENAI_API_KEY
      - HF_API_KEY
    ports:
      - "6702:8000" # Maps server port 6702 to container port 8000
    #volumes:
      # Mount the 'uploads' folder to persist user uploads
    #  - ./backend/uploads:/code/uploads
    networks:
      - summary-network
    depends_on:
      postgres:
        condition: service_healthy  # migrations run on backend start

  # 3. Postgres Database Service
  postgres:
    image: postgres:16
    container_name: summary-postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-summarizer}"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      - POSTGRES_DB=summarizer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sql
    #volumes:
      # Use the custom named volume for persistent data
    #  - summary-postgres-data:/var/lib/postgresql/data
    ports:
      - "6703:5432" # Exposes Postgres on the server (remove if not needed)
    networks:
      - summary-network

# Define the custom volume
#volumes:
#  summary-postgres-data:
#    name: summary-postgres-data

# Define the custom network
networks:
  summary-network:
    name: summary-network
